name: Flash Loan System - Comprehensive Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Quick smoke tests for fast feedback
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Run smoke tests
      run: |
        python -m pytest \
          test_input_validation.py::InputValidationTestSuite::test_string_validation_normal \
          test_enhanced_oracle_security_fixed.py::TestEnhancedOracleSecurityMonitor::test_initialization \
          --verbose --tb=short --timeout=60
    
    - name: Upload smoke test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: smoke-test-results-${{ matrix.python-version }}
        path: |
          .pytest_cache/
          *.log

  # Unit tests with coverage
  unit-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Run unit tests
      run: |
        python -m pytest \
          test_input_validation.py \
          test_enhanced_oracle_security.py \
          test_enhanced_oracle_security_fixed.py \
          -m "unit" \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --verbose \
          --tb=short \
          --timeout=300 \
          --junitxml=unit-test-results.xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unit-tests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results
        path: |
          unit-test-results.xml
          htmlcov/
          coverage.xml

  # Security tests
  security-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Run security tests
      run: |
        python -m pytest \
          security_test_suite.py \
          test_gas_griefing_protection.py \
          test_oracle_attack_scenarios.py \
          test_oracle_attack_scenarios_fixed.py \
          -m "security" \
          --verbose \
          --tb=short \
          --timeout=900 \
          --junitxml=security-test-results.xml
    
    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
    
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Upload security test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          security-test-results.xml
          bandit-report.json
          safety-report.json

  # Integration tests (requires more setup)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests]
    
    services:
      ganache:
        image: trufflesuite/ganache-cli:latest
        ports:
          - 8545:8545
        options: >-
          --health-cmd "curl -f http://localhost:8545"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Wait for Ganache
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8545; do sleep 2; done'
    
    - name: Run integration tests
      run: |
        python -m pytest \
          test_oracle_security_integration.py \
          test_oracle_security_integration_fixed.py \
          test_distributed_agents.py \
          test_cross_chain_security.py \
          -m "integration" \
          --verbose \
          --tb=short \
          --timeout=600 \
          --junitxml=integration-test-results.xml
      env:
        WEB3_PROVIDER_URL: http://localhost:8545
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-test-results.xml
          *.log

  # Performance tests (run on schedule only)
  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: integration-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Run performance tests
      run: |
        python -m pytest \
          oracle_security_testing_suite.py \
          test_advanced_oracle_security.py \
          -m "performance or slow" \
          --verbose \
          --tb=short \
          --timeout=1200 \
          --junitxml=performance-test-results.xml
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          performance-test-results.xml
          *.log

  # Generate comprehensive report
  test-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests, integration-tests]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate comprehensive test report
      run: |
        python test_runner.py --project-root . --no-coverage
    
    - name: Upload comprehensive report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: comprehensive-test-report
        path: |
          test_report.html
          test_report.json
          test_results/

  # Test result notification
  notify-results:
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests, integration-tests, test-report]
    if: always()
    
    steps:
    - name: Notify test results
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Flash Loan System Test Results:
          - Unit Tests: ${{ needs.unit-tests.result }}
          - Security Tests: ${{ needs.security-tests.result }}
          - Integration Tests: ${{ needs.integration-tests.result }}
          
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
