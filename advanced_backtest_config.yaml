# 🧠 ADVANCED BACKTESTING & OPTIMIZATION CONFIGURATION
# ===================================================

# BACKTESTING PARAMETERS
backtesting:
  # Time periods for different test types
  quick_test:
    start_date: "2023-12-25"
    end_date: "2024-01-01"
    strategies: ["simple_arbitrage", "triangular_arbitrage", "yield_arbitrage"]
    
  standard_test:
    start_date: "2023-11-01" 
    end_date: "2024-01-01"
    strategies: ["simple_arbitrage", "triangular_arbitrage", "flash_arbitrage", "cross_chain_arbitrage", "yield_arbitrage"]
    
  comprehensive_test:
    start_date: "2023-01-01"
    end_date: "2024-01-01"
    strategies: ["simple_arbitrage", "triangular_arbitrage", "flash_arbitrage", "cross_chain_arbitrage", "mev_sandwich", "liquidation_arbitrage", "yield_arbitrage"]
  
  # Data generation parameters
  data_frequency: "5min"        # 5min, 15min, 1hour
  market_conditions:
    volatility_range: [0.01, 0.05]     # 1-5% volatility
    volume_range: [1000, 100000]       # $1k-$100k volume
    gas_price_range: [10, 100]         # 10-100 gwei
    network_congestion: [0.1, 0.9]     # 10-90% congestion

# STRATEGY CONFIGURATIONS
strategies:
  simple_arbitrage:
    frequency: 0.30           # 30% chance per interval
    profit_range: [0.5, 5.0] # $0.50-$5.00 profit
    success_rate: 0.85        # 85% success rate
    gas_multiplier: 0.001     # Gas cost multiplier
    
  triangular_arbitrage:
    frequency: 0.20           # 20% chance per interval
    profit_range: [1.0, 8.0] # $1.00-$8.00 profit
    success_rate: 0.75        # 75% success rate
    gas_multiplier: 0.003     # Higher gas (3 transactions)
    
  flash_arbitrage:
    frequency: 0.10           # 10% chance per interval
    profit_range: [5.0, 50.0] # $5.00-$50.00 profit
    success_rate: 0.80        # 80% success rate
    flash_loan_fee: 0.0009    # 0.09% flash loan fee
    max_loan_amount: 100000   # $100k max flash loan
    
  cross_chain_arbitrage:
    frequency: 0.15           # 15% chance per interval
    profit_range: [2.0, 15.0] # $2.00-$15.00 profit
    success_rate: 0.70        # 70% success rate (bridge risks)
    bridge_fee: 0.005         # 0.5% bridge fee
    execution_time: [5, 10]   # 5-10 minutes
    
  mev_sandwich:
    frequency: 0.25           # 25% chance per interval
    profit_range: [0.8, 12.0] # $0.80-$12.00 profit
    success_rate: 0.90        # 90% success rate
    front_run_multiplier: 0.1 # 10% of pending tx size
    
  liquidation_arbitrage:
    frequency: 0.05           # 5% chance per interval
    profit_range: [10.0, 100.0] # $10.00-$100.00 profit
    success_rate: 0.85        # 85% success rate
    liquidation_bonus: [0.05, 0.15] # 5-15% bonus
    
  yield_arbitrage:
    frequency: 0.40           # 40% chance per interval
    profit_range: [0.2, 2.0] # $0.20-$2.00 profit
    success_rate: 0.95        # 95% success rate
    yield_spread: [0.02, 0.15] # 2-15% APY spread

# RISK MANAGEMENT PARAMETERS
risk_management:
  # Portfolio level
  max_drawdown_threshold: 0.20      # 20% max drawdown
  min_sharpe_ratio: 1.5             # Minimum Sharpe ratio
  max_var_95: 0.05                  # 5% VaR at 95% confidence
  correlation_limit: 0.7            # Max 70% correlation between strategies
  
  # Position level
  max_position_size_percent: 10.0   # Max 10% per trade
  max_total_exposure_percent: 80.0  # Max 80% total exposure
  min_trade_size_usd: 5.00          # Minimum $5 trade
  
  # Strategy level
  max_consecutive_losses: 3         # Stop strategy after 3 losses
  min_win_rate: 0.60               # Minimum 60% win rate
  max_strategy_drawdown: 0.15       # Max 15% strategy drawdown

# OPTIMIZATION PARAMETERS
optimization:
  # Objective functions
  primary_metric: "risk_adjusted_return"  # or "total_return", "sharpe_ratio"
  secondary_metrics: ["sharpe_ratio", "max_drawdown", "win_rate"]
  
  # Rebalancing
  rebalance_frequency: "daily"      # daily, weekly, monthly
  min_allocation_change: 0.05       # 5% minimum change to rebalance
  
  # Portfolio constraints
  min_strategy_weight: 0.05         # Minimum 5% allocation
  max_strategy_weight: 0.40         # Maximum 40% allocation
  max_strategies_active: 5          # Maximum 5 strategies active
  
  # Optimization methods
  methods:
    - "mean_variance"               # Modern Portfolio Theory
    - "risk_parity"                # Equal risk contribution
    - "maximum_diversification"     # Maximum diversification
    - "minimum_variance"           # Minimum variance

# LIVE OPTIMIZATION PARAMETERS
live_optimization:
  enabled: true
  
  # Performance monitoring
  performance_threshold: 0.10       # 10% underperformance triggers reopt
  monitoring_window_days: 7         # 7-day performance window
  
  # Adaptation parameters
  adaptation_speed: 0.20            # 20% adaptation rate
  min_data_points: 50              # Minimum data points for reoptimization
  
  # Emergency stops
  emergency_stop_loss: 0.30         # 30% loss triggers emergency stop
  max_daily_loss: 0.15             # 15% max daily loss
  
  # Notification thresholds
  profit_alert_threshold: 0.05      # 5% profit alert
  loss_alert_threshold: 0.03        # 3% loss alert

# PERFORMANCE ANALYSIS
performance_analysis:
  # Metrics to calculate
  metrics:
    - "total_return"
    - "annualized_return"
    - "sharpe_ratio"
    - "sortino_ratio"
    - "max_drawdown"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
    - "var_95"
    - "cvar_95"
    - "beta"
    - "alpha"
    - "information_ratio"
    
  # Benchmarks
  benchmarks:
    - name: "buy_and_hold_eth"
      return: 0.60              # 60% annual return
    - name: "defi_index"
      return: 0.45              # 45% annual return
    - name: "risk_free_rate"
      return: 0.05              # 5% risk-free rate
      
  # Reporting
  generate_plots: true
  save_results: true
  export_formats: ["json", "csv", "html"]

# DATA SOURCES
data_sources:
  # Price data
  price_feeds:
    - "coingecko"
    - "coinmarketcap"
    - "dex_screener"
    
  # DEX data
  dex_apis:
    polygon:
      - "quickswap_subgraph"
      - "sushiswap_subgraph"
      - "uniswap_v3_subgraph"
    bsc:
      - "pancakeswap_api"
      - "biswap_api"
    arbitrum:
      - "uniswap_v3_subgraph"
      - "sushiswap_subgraph"
      - "curve_api"
    optimism:
      - "uniswap_v3_subgraph"
      - "synthetix_api"
      
  # Market data
  market_data:
    - "defipulse"
    - "debank"
    - "zapper"
    - "1inch"

# MACHINE LEARNING PARAMETERS
machine_learning:
  # Model types
  models:
    - "random_forest"
    - "gradient_boosting"
    - "neural_network"
    - "lstm"
    - "transformer"
    
  # Feature engineering
  features:
    - "price_momentum"
    - "volume_profile"
    - "volatility_surface"
    - "liquidity_depth"
    - "gas_price_trend"
    - "network_congestion"
    - "whale_activity"
    - "sentiment_score"
    
  # Training parameters
  training:
    test_size: 0.2              # 20% test set
    validation_size: 0.2        # 20% validation set
    cross_validation_folds: 5   # 5-fold CV
    hyperparameter_tuning: true
    
  # Model selection
  selection_metric: "sharpe_ratio"
  ensemble_methods: ["voting", "stacking", "blending"]

# VISUALIZATION PARAMETERS
visualization:
  # Chart types
  charts:
    - "equity_curve"
    - "drawdown_chart"
    - "returns_distribution"
    - "correlation_matrix"
    - "strategy_allocation"
    - "performance_attribution"
    - "risk_metrics"
    
  # Styling
  style: "plotly_dark"
  color_palette: "viridis"
  figure_size: [12, 8]
  
  # Interactive features
  interactive: true
  save_html: true
  show_annotations: true

# INTEGRATION PARAMETERS
integration:
  # Existing systems
  systems:
    institutional_grade: true
    ultimate_agent: true
    maximum_profit: true
    micro_capital: true
    
  # Smart contracts
  contracts:
    strategy_incubator: true
    arbitrage_executor: true
    ai_strategy: true
    
  # APIs
  apis:
    web3_providers: ["infura", "alchemy", "quicknode"]
    dex_aggregators: ["1inch", "paraswap", "matcha"]
    
# SECURITY PARAMETERS
security:
  # API keys (use environment variables)
  api_keys:
    infura_key: "${INFURA_API_KEY}"
    alchemy_key: "${ALCHEMY_API_KEY}"
    coingecko_key: "${COINGECKO_API_KEY}"
    
  # Wallet security
  wallet:
    use_hardware_wallet: true
    multi_sig_required: false
    private_key_encryption: true
    
  # Risk limits
  limits:
    max_daily_trades: 100
    max_gas_spend_daily: 50.0   # $50 max gas per day
    max_slippage: 0.02          # 2% max slippage

# LOGGING AND MONITORING
logging:
  level: "INFO"
  file: "advanced_backtesting.log"
  max_size: "100MB"
  backup_count: 5
  
  # Metrics to log
  log_metrics:
    - "trade_execution"
    - "strategy_performance"
    - "risk_metrics"
    - "optimization_results"
    - "system_health"
    
# NOTIFICATION SETTINGS
notifications:
  # Channels
  channels:
    email: false
    telegram: false
    slack: false
    webhook: false
    
  # Alert types
  alerts:
    profit_target_reached: true
    loss_threshold_exceeded: true
    strategy_rebalanced: true
    system_error: true
    optimization_completed: true