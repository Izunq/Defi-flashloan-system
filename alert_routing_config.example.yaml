# Alert Routing Configuration - EXAMPLE FILE
# Copy this file to alert_routing_config.yaml and update with your actual values

# Global routing settings
global_settings:
  rate_limit: 10  # alerts per minute per channel
  deduplication_window: 300  # seconds - suppress duplicate alerts within this window
  escalation_delay: 900  # 15 minutes - escalate if alert not acknowledged
  batch_size: 5  # maximum alerts to batch together
  batch_timeout: 30  # seconds to wait before sending incomplete batch

# Routing rules by sentinel type and alert level
routing_rules:
  
  # Oracle Sentinel Alert Routing
  oracle_sentinel:
    LOW:
      channels: ["websocket"]
      throttle: 60  # seconds between similar alerts
      batch_enabled: true
    MEDIUM:
      channels: ["websocket", "slack"]
      throttle: 30
      batch_enabled: true
    HIGH:
      channels: ["websocket", "slack", "email"]
      throttle: 10
      batch_enabled: false
      escalation:
        delay: 600  # 10 minutes
        channels: ["sms"]
    CRITICAL:
      channels: ["websocket", "slack", "email", "sms"]
      throttle: 0  # no throttling
      batch_enabled: false
      immediate: true
      escalation:
        delay: 300  # 5 minutes
        channels: ["webhook"]
    EMERGENCY:
      channels: ["all_channels"]
      throttle: 0
      batch_enabled: false
      immediate: true
      emergency_contacts: true
      contract_action: "pause_if_configured"

# Channel specific configurations
channel_configs:
  
  websocket:
    format: "json"
    include_metadata: true
    compression: true
    max_message_size: 8192
    
  slack:
    format: "markdown"
    thread_alerts: true  # group related alerts in threads
    emoji_severity: true  # use emojis for severity levels
    mention_users:
      CRITICAL: ["@channel"]
      EMERGENCY: ["@here", "@dev-team"]
    templates:
      oracle: "🔮 **Oracle Alert** [{level}]\n**Type:** {alert_type}\n**Message:** {message}\n**Time:** {timestamp}"
      mev: "⚡ **MEV Alert** [{level}]\n**Type:** {alert_type}\n**Message:** {message}\n**Time:** {timestamp}"
      strategy: "📈 **Strategy Alert** [{level}]\n**Type:** {alert_type}\n**Message:** {message}\n**Time:** {timestamp}"
      
  email:
    format: "html"
    subject_prefix: "[SENTINEL ALERT]"
    include_charts: true
    include_logs: true
    max_log_lines: 50
    smtp_server: "YOUR_SMTP_SERVER"
    smtp_port: 587
    username: "YOUR_EMAIL_USERNAME"
    password: "YOUR_EMAIL_PASSWORD"
    from_address: "YOUR_FROM_EMAIL"
    to_addresses: ["YOUR_ALERT_EMAIL"]
    
  sms:
    format: "text"
    max_length: 160
    service: "twilio"  # or "aws_sns"
    api_key: "YOUR_SMS_API_KEY"
    from_number: "YOUR_SMS_FROM_NUMBER"
    to_numbers: ["YOUR_PHONE_NUMBER"]
    
  webhook:
    format: "json"
    url: "YOUR_WEBHOOK_URL"
    timeout: 10  # seconds
    retry_attempts: 3
    retry_delay: 5  # seconds
    include_full_context: true

# Emergency contact configuration
emergency_contacts:
  enabled: true
  contacts:
    - name: "Primary Admin"
      email: "admin@yourdomain.com"
      phone: "+1234567890"
      slack_user: "@admin"
      priority: 1
    - name: "Secondary Admin"
      email: "admin2@yourdomain.com"
      phone: "+1234567891"
      slack_user: "@admin2"
      priority: 2
