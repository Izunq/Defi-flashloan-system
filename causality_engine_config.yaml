# Causality Engine Configuration

# Data sources configuration
data_sources:
  news_api:
    endpoint: "https://newsapi.org/v2/everything"
    api_key: "${NEWS_API_KEY}"  # Will be replaced with environment variable
    categories:
      - "cryptocurrency"
      - "blockchain"
      - "defi"
      - "regulation"
      - "finance"
      - "economics"
  
  market_data:
    endpoint: "https://api.coingecko.com/api/v3"
    assets:
      - "bitcoin"
      - "ethereum"
      - "usd-coin"
      - "tether"
      - "dai"
      - "aave"
      - "compound-governance-token"
      - "uniswap"
      - "chainlink"
  
  social_sentiment:
    endpoint: "https://api.example.com/sentiment"
    api_key: "${SENTIMENT_API_KEY}"  # Will be replaced with environment variable
    platforms:
      - "twitter"
      - "reddit"
      - "discord"
      - "telegram"
    keywords:
      - "crypto"
      - "defi"
      - "ethereum"
      - "bitcoin"
      - "regulation"
      - "hack"
      - "exploit"
  
  regulatory_feeds:
    endpoint: "https://api.example.com/regulatory"
    regions:
      - "US"
      - "EU"
      - "UK"
      - "SG"
      - "JP"
      - "CH"
    sources:
      - "sec"
      - "cftc"
      - "finma"
      - "fca"
      - "mas"
      - "fsb"
  
  supply_chain:
    endpoint: "https://api.example.com/supply"
    commodities:
      - "semiconductors"
      - "energy"
      - "rare_earth"
    regions:
      - "global"
      - "asia"
      - "north_america"
      - "europe"

# Model parameters
model_params:
  lstm_units: 128
  dense_units: [256, 128, 64]
  learning_rate: 0.001
  dropout_rate: 0.2
  batch_size: 32
  epochs: 100
  patience: 10
  embedding_dim: 768  # BERT embedding dimension

# Event types to monitor and predict
event_types:
  - "regulatory_change"
  - "market_volatility"
  - "liquidity_crisis"
  - "protocol_hack"
  - "macro_economic_shift"
  - "supply_shock"
  - "governance_proposal"
  - "protocol_upgrade"
  - "token_migration"
  - "oracle_failure"

# Time horizons for predictions
time_horizons:
  - name: "short_term"
    days: 7
    description: "Events likely to occur within 7 days"
  
  - name: "medium_term"
    days: 30
    description: "Events likely to occur within 30 days"
  
  - name: "long_term"
    days: 90
    description: "Events likely to occur within 90 days"

# Data and model storage
data_dir: "data/causality_engine"
model_dir: "models/causality_engine"
cache_expiry: 3600  # seconds

# Oracle integration
oracle:
  update_frequency: 3600  # seconds
  min_confidence: 0.7  # Minimum confidence threshold for publishing to oracle
  gas_price_strategy: "fast"  # Options: slow, standard, fast
  retry_attempts: 3
  retry_delay: 60  # seconds

# Logging configuration
logging:
  level: "INFO"
  file: "logs/causality_engine.log"
  max_size: 10485760  # 10 MB
  backup_count: 5