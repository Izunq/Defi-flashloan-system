# Artemis Swarm Integration Configuration
# =====================================

# Redis connection for inter-agent communication
redis_url: "redis://localhost:6379/0"

# Artemis AI Core API URL
artemis_api_url: "http://localhost:8000"

# Update interval in seconds
update_interval_seconds: 60

# Halal compliance mode
halal_mode: false

# Maximum concurrent strategies
max_concurrent_strategies: 10

# Risk parameters
risk_parameters:
  max_capital_per_strategy: 1000.0
  max_total_capital: 10000.0
  min_profit_threshold_usd: 1.0
  max_gas_price_gwei: 100

# Logging configuration
logging:
  level: "INFO"
  file: "logs/artemis/swarm_integration.log"
  max_size_mb: 10
  backup_count: 5

# Performance metrics
metrics:
  enabled: true
  collection_interval_seconds: 60
  retention_days: 7

# Security settings
security:
  input_validation: true
  transaction_signing: "secure"
  max_gas_price_gwei: 100

# Notification settings
notifications:
  min_profit_for_notification_usd: 5.0
  channels:
    - "strategy_alerts"
    - "execution_alerts"

# AI parameters
ai_parameters:
  confidence_threshold: 0.7
  max_response_tokens: 1000
  temperature: 0.7
  model: "artemis-core-v2"