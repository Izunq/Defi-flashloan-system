# Database Architecture Configuration
primary_db:
  type: PostgreSQL 15
  cluster: 3-node HA
  replication: synchronous
  backup: continuous WAL-E
  connection:
    host: primary-db.internal
    port: 5432
    database: flashloan_primary
    user: ${DB_PRIMARY_USER}
    password: ${DB_PRIMARY_PASSWORD}
    ssl: true
    ssl_mode: verify-full
    ssl_cert: /etc/ssl/certs/db-client-cert.pem
    ssl_key: /etc/ssl/private/db-client-key.pem
    ssl_root_cert: /etc/ssl/certs/db-ca-cert.pem
  pool:
    min_connections: 5
    max_connections: 50
    connection_timeout: 30
    idle_timeout: 300
    max_lifetime: 3600
  tables:
    - name: transactions
      columns:
        - name: id
          type: UUID
          primary_key: true
        - name: tx_hash
          type: VARCHAR(66)
          index: true
        - name: from_address
          type: VARCHAR(42)
          index: true
        - name: to_address
          type: VARCHAR(42)
          index: true
        - name: value
          type: NUMERIC(78,0)
        - name: gas_price
          type: NUMERIC(78,0)
        - name: gas_used
          type: NUMERIC(78,0)
        - name: status
          type: SMALLINT
        - name: block_number
          type: BIGINT
          index: true
        - name: timestamp
          type: TIMESTAMP
          index: true
        - name: data
          type: BYTEA
    - name: arbitrage_opportunities
      columns:
        - name: id
          type: UUID
          primary_key: true
        - name: token_pair
          type: VARCHAR(20)
          index: true
        - name: exchange_a
          type: VARCHAR(50)
          index: true
        - name: exchange_b
          type: VARCHAR(50)
          index: true
        - name: price_difference
          type: NUMERIC(18,8)
        - name: potential_profit
          type: NUMERIC(18,8)
        - name: timestamp
          type: TIMESTAMP
          index: true
        - name: executed
          type: BOOLEAN
          default: false
        - name: execution_tx_id
          type: UUID
          foreign_key: transactions.id
          nullable: true

analytics_db:
  type: ClickHouse
  cluster: 6-node sharded
  compression: LZ4
  retention: 7 years
  connection:
    host: analytics-db.internal
    port: 9000
    database: flashloan_analytics
    user: ${DB_ANALYTICS_USER}
    password: ${DB_ANALYTICS_PASSWORD}
    secure: true
    verify: true
    ca_cert: /etc/ssl/certs/clickhouse-ca-cert.pem
  tables:
    - name: market_data
      engine: MergeTree
      partition_by: toYYYYMM(timestamp)
      order_by: (token_pair, exchange, timestamp)
      ttl: timestamp + INTERVAL 7 YEAR
      columns:
        - name: token_pair
          type: String
        - name: exchange
          type: String
        - name: price
          type: Decimal(18,8)
        - name: volume_24h
          type: Decimal(18,8)
        - name: liquidity
          type: Decimal(18,8)
        - name: timestamp
          type: DateTime
    - name: arbitrage_analytics
      engine: MergeTree
      partition_by: toYYYYMM(timestamp)
      order_by: (token_pair, timestamp)
      ttl: timestamp + INTERVAL 7 YEAR
      columns:
        - name: token_pair
          type: String
        - name: exchange_a
          type: String
        - name: exchange_b
          type: String
        - name: price_difference
          type: Decimal(18,8)
        - name: potential_profit
          type: Decimal(18,8)
        - name: executed
          type: UInt8
        - name: execution_time_ms
          type: UInt32
        - name: gas_cost_usd
          type: Decimal(18,8)
        - name: net_profit
          type: Decimal(18,8)
        - name: timestamp
          type: DateTime

cache_layer:
  type: Redis Cluster
  nodes: 6
  persistence: AOF + RDB
  connection:
    hosts:
      - host: redis-0.internal
        port: 6379
      - host: redis-1.internal
        port: 6379
      - host: redis-2.internal
        port: 6379
      - host: redis-3.internal
        port: 6379
      - host: redis-4.internal
        port: 6379
      - host: redis-5.internal
        port: 6379
    password: ${REDIS_PASSWORD}
    ssl: true
    ssl_cert: /etc/ssl/certs/redis-client-cert.pem
    ssl_key: /etc/ssl/private/redis-client-key.pem
    ssl_ca_cert: /etc/ssl/certs/redis-ca-cert.pem
  configuration:
    maxmemory: 8gb
    maxmemory-policy: volatile-lru
    aof-use-rdb-preamble: yes
    aof-rewrite-incremental-fsync: yes
    rdb-save-incremental-fsync: yes
  keys:
    - name: market:prices:{token_pair}:{exchange}
      type: hash
      ttl: 300
    - name: arbitrage:opportunities:{token_pair}
      type: sorted-set
      ttl: 60
    - name: gas:price
      type: string
      ttl: 30
    - name: blockchain:block:{number}
      type: hash
      ttl: 86400

kafka:
  bootstrap_servers:
    - kafka-0.internal:9092
    - kafka-1.internal:9092
    - kafka-2.internal:9092
  security:
    security_protocol: SASL_SSL
    sasl_mechanism: SCRAM-SHA-512
    sasl_username: ${KAFKA_USERNAME}
    sasl_password: ${KAFKA_PASSWORD}
    ssl_cafile: /etc/ssl/certs/kafka-ca-cert.pem
    ssl_certfile: /etc/ssl/certs/kafka-client-cert.pem
    ssl_keyfile: /etc/ssl/private/kafka-client-key.pem
  topics:
    - name: market-data
      partitions: 12
      replication_factor: 3
      retention_ms: 604800000  # 7 days
    - name: arbitrage-opportunities
      partitions: 6
      replication_factor: 3
      retention_ms: 86400000  # 1 day
    - name: executed-trades
      partitions: 6
      replication_factor: 3
      retention_ms: 2592000000  # 30 days

airflow:
  dags_folder: /opt/airflow/dags
  executor: CeleryExecutor
  sql_alchemy_conn: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db.internal:5432/airflow
  broker_url: redis://:${AIRFLOW_REDIS_PASSWORD}@airflow-redis.internal:6379/0
  result_backend: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db.internal:5432/airflow
  dags:
    - name: market_data_etl
      schedule_interval: "*/10 * * * *"  # Every 10 minutes
      catchup: false
    - name: arbitrage_analytics
      schedule_interval: "0 * * * *"  # Hourly
      catchup: false
    - name: data_quality_checks
      schedule_interval: "0 0 * * *"  # Daily
      catchup: false