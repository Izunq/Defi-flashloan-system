# Emergency Monitoring System Configuration
# ========================================

# Monitoring intervals (in seconds)
monitoring_interval: 30
alert_cooldown: 300
max_alerts_per_hour: 50

# Emergency contacts
emergency_contacts:
  - "admin@flashloan.com"
  - "security@flashloan.com"
  - "ops@flashloan.com"

# Webhook URLs for external notifications
webhook_urls:
  - "https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK"
  - "https://api.pagerduty.com/incidents"

# Email configuration
email_config:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: "alerts@flashloan.com"
  password: "your_email_password"
  use_tls: true

# Auto-recovery settings
auto_recovery_enabled: true
predictive_alerts_enabled: true

# Escalation thresholds
escalation_thresholds:
  critical_alerts: 3        # Escalate after 3 critical alerts
  failed_transactions: 10   # Escalate after 10 failed transactions
  security_breaches: 1      # Escalate immediately on security breach
  oracle_failures: 2       # Escalate after 2 oracle failures
  bridge_failures: 1       # Escalate immediately on bridge failure

# Health monitoring thresholds
health_thresholds:
  cpu_usage:
    warning: 70
    critical: 90
    emergency: 95
  memory_usage:
    warning: 80
    critical: 95
    emergency: 98
  disk_usage:
    warning: 85
    critical: 95
    emergency: 98
  response_time:
    warning: 2000    # ms
    critical: 5000   # ms
    emergency: 10000 # ms
  error_rate:
    warning: 0.05    # 5%
    critical: 0.15   # 15%
    emergency: 0.25  # 25%

# Security monitoring settings
security_monitoring:
  log_file_paths:
    - "security_monitoring.log"
    - "access_control.log"
    - "validation_errors.log"
  suspicious_patterns:
    - "SQL injection attempt"
    - "Buffer overflow attempt"
    - "Unauthorized access"
    - "Rate limit exceeded"
    - "Invalid signature"
  max_failed_attempts: 5
  lockout_duration: 3600  # seconds

# MEV protection monitoring
mev_monitoring:
  threat_level_thresholds:
    medium: 3
    high: 5
    critical: 10
  max_failed_protections: 5
  max_response_time_ms: 5000
  protection_rate_threshold: 0.95

# Cross-chain monitoring
cross_chain_monitoring:
  supported_chains:
    - chain_id: 1
      name: "Ethereum"
      rpc_url: "https://mainnet.infura.io/v3/YOUR_KEY"
      bridge_endpoint: "https://bridge.ethereum.org"
    - chain_id: 137
      name: "Polygon"
      rpc_url: "https://polygon-rpc.com"
      bridge_endpoint: "https://bridge.polygon.technology"
    - chain_id: 56
      name: "BSC"
      rpc_url: "https://bsc-dataseed.binance.org"
      bridge_endpoint: "https://bridge.binance.org"
  max_block_age: 300      # seconds
  confirmation_depth: 12

# Financial monitoring
financial_monitoring:
  loss_rate_threshold: 0.10      # 10%
  profit_rate_threshold: 0.05    # 5%
  gas_price_thresholds:
    warning: 50     # gwei
    critical: 100   # gwei
    emergency: 200  # gwei
  slippage_thresholds:
    warning: 0.01   # 1%
    critical: 0.05  # 5%
    emergency: 0.10 # 10%

# Oracle monitoring
oracle_monitoring:
  oracles:
    - name: "Chainlink"
      endpoint: "https://api.chain.link/health"
      price_feeds:
        - "ETH/USD"
        - "BTC/USD"
        - "USDC/USD"
    - name: "Uniswap V3"
      endpoint: "https://api.thegraph.com/subgraphs/name/uniswap/uniswap-v3"
  price_deviation_threshold: 0.05  # 5%
  consensus_threshold: 3           # Minimum oracles required

# Recovery strategies
recovery_strategies:
  high_cpu:
    action: "restart_service"
    cooldown: 600
  high_memory:
    action: "garbage_collection"
    cooldown: 300
  slow_response:
    action: "increase_resources"
    cooldown: 1800
  security_breach:
    action: "emergency_shutdown"
    cooldown: 0
  oracle_failure:
    action: "switch_to_backup"
    cooldown: 120

# Dashboard settings
dashboard:
  update_interval: 5      # seconds
  history_retention: 24   # hours
  max_alerts_display: 50

# Logging configuration
logging:
  level: "INFO"
  file: "emergency_monitoring.log"
  max_size: "100MB"
  backup_count: 10
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Maintenance windows (UTC)
maintenance_windows:
  - day: "Sunday"
    start_time: "02:00"
    end_time: "04:00"
    suppress_alerts: true
