# 🔥 MAXIMUM PROFIT ARBITRAGE CONFIGURATION - AGGRESSIVE EDITION
# ==============================================================

# AGGRESSIVE SETTINGS FOR MAXIMUM PROFIT EXTRACTION
capital_settings:
  starting_capital_usd: 50.00
  minimum_profit_usd: 0.25        # Lower threshold for more opportunities
  maximum_gas_cost_usd: 3.00      # Willing to pay more gas for higher profits
  position_size_percent: 95.0     # Use 95% of capital per trade
  leverage_simulation: 2.5        # Simulate 2.5x leverage effect
  
# AGGRESSIVE PERFORMANCE TARGETS
performance_targets:
  daily_target_percent: 30.0      # 30% daily target ($15 on $50)
  hourly_target_percent: 2.0      # 2% hourly target
  weekly_target_percent: 200.0    # 200% weekly target
  monthly_target_percent: 1000.0  # 1000% monthly target (10x capital)
  compound_growth: true           # Aggressive reinvestment
  
# AGGRESSIVE RISK MANAGEMENT
risk_management:
  stop_loss_percent: 8.0          # Higher stop loss for bigger profits
  max_daily_loss_percent: 25.0    # Max 25% daily loss
  max_consecutive_losses: 2       # Stop after 2 losses in a row
  leverage_limit: 3.0             # Maximum 3x leverage simulation
  
# MULTI-STRATEGY EXECUTION
strategies:
  enabled_strategies:
    - simple_arbitrage      # Basic DEX arbitrage
    - triangular_arbitrage  # 3-token arbitrage
    - flash_arbitrage      # Flash loan arbitrage
    - cross_chain_arbitrage # Cross-chain opportunities
    - mev_sandwich         # MEV extraction
    - liquidation_arbitrage # Liquidation opportunities
    - yield_arbitrage      # Yield farming arbitrage
  
  max_concurrent_trades: 5        # Execute 5 trades simultaneously
  strategy_diversification: true  # Use multiple strategies
  
# NETWORK COVERAGE (All profitable chains)
networks:
  preferred_chains:
    - polygon      # ~$0.01 gas, high volume
    - bsc         # ~$0.25 gas, many DEXs
    - arbitrum    # ~$0.75 gas, advanced features
    - optimism    # ~$0.50 gas, growing ecosystem
    - avalanche   # ~$1.00 gas, high throughput
    - fantom      # ~$0.05 gas, fast transactions
  
  gas_limits:
    polygon: 0.10     # Max $0.10 gas on Polygon
    bsc: 1.00         # Max $1.00 gas on BSC
    arbitrum: 2.00    # Max $2.00 gas on Arbitrum
    optimism: 1.50    # Max $1.50 gas on Optimism
    avalanche: 2.50   # Max $2.50 gas on Avalanche
    fantom: 0.25      # Max $0.25 gas on Fantom

# EXPANDED TRADING PAIRS
trading_pairs:
  stablecoin_arbitrage:
    - USDC/USDT    # High frequency, low risk
    - DAI/USDC     # Stable arbitrage
    - BUSD/USDT    # BSC stablecoin arb
    - FRAX/USDC    # Frax ecosystem
    - MIM/USDT     # Magic Internet Money
    
  wrapped_token_arbitrage:
    - WETH/ETH     # Wrapped token opportunities
    - WMATIC/MATIC # Polygon native
    - WBNB/BNB     # BSC native
    - WAVAX/AVAX   # Avalanche native
    - WFTM/FTM     # Fantom native
    
  major_pairs:
    - ETH/USDC     # High volume
    - BTC/USDT     # High volume
    - MATIC/USDC   # Polygon ecosystem
    - BNB/BUSD     # BSC ecosystem
    - AVAX/USDC    # Avalanche ecosystem
    
  volatile_pairs:
    - LINK/USDC    # Chainlink
    - UNI/USDT     # Uniswap
    - AAVE/USDC    # Aave
    - CRV/USDT     # Curve
    - SUSHI/USDC   # SushiSwap
    
  cross_chain_opportunities:
    - ETH/WETH     # Cross-chain ETH
    - USDC/USDC.e  # Bridged USDC
    - USDT/USDT.e  # Bridged USDT

# DEX COVERAGE (Maximum coverage)
dex_preferences:
  polygon:
    primary:
      - quickswap
      - sushiswap
      - uniswap_v3
    secondary:
      - curve
      - balancer
      - dodo
      - kyber
      
  bsc:
    primary:
      - pancakeswap
      - biswap
      - apeswap
    secondary:
      - babyswap
      - mdex
      - venus
      - ellipsis
      
  arbitrum:
    primary:
      - uniswap_v3
      - sushiswap
      - curve
    secondary:
      - balancer
      - dodo
      - kyber
      - camelot
      
  optimism:
    primary:
      - uniswap_v3
      - synthetix
      - curve
    secondary:
      - velodrome
      - beethoven
      
  avalanche:
    primary:
      - traderjoe
      - pangolin
      - sushiswap
    secondary:
      - curve
      - kyber
      
  fantom:
    primary:
      - spookyswap
      - spiritswap
      - sushiswap
    secondary:
      - curve
      - beethoven

# AGGRESSIVE EXECUTION SETTINGS
execution:
  max_slippage_percent: 2.0       # Higher slippage for more opportunities
  execution_timeout_seconds: 15   # Faster timeout
  retry_attempts: 3               # More retry attempts
  
  # Aggressive timing
  scan_interval_seconds: 5        # Scan every 5 seconds
  opportunity_expiry_seconds: 30  # Opportunities expire in 30 seconds
  
  # Position sizing
  min_trade_size_usd: 2.00       # Minimum $2 trade
  max_trade_size_usd: 47.50      # Maximum $47.50 trade (95% of $50)
  
  # Flash loan settings
  flash_loan_enabled: true
  max_flash_loan_amount: 100000  # Up to $100k flash loans
  flash_loan_fee_percent: 0.09   # 0.09% flash loan fee
  
  # MEV settings
  mev_detection_enabled: true
  sandwich_attack_enabled: true
  front_running_enabled: true

# MONITORING & ALERTS (Aggressive tracking)
monitoring:
  log_level: INFO
  save_trades: true
  trade_history_file: "max_profit_trades.json"
  
  alerts:
    profit_threshold_usd: 1.00    # Alert when profit > $1
    loss_threshold_usd: 2.50      # Alert when loss > $2.50
    hourly_target_reached: true   # Alert when hourly target reached
    daily_target_reached: true    # Alert when daily target reached
    
  reporting:
    hourly_summary: true
    daily_summary: true
    performance_tracking: true
    strategy_performance: true

# AGGRESSIVE GROWTH STRATEGY
growth_strategy:
  compound_profits: true          # Reinvest ALL profits
  
  scaling_thresholds:
    - capital: 75.00             # At $75, increase aggression
      max_position_percent: 97.0
      daily_target_percent: 25.0
      leverage_simulation: 3.0
      
    - capital: 150.00            # At $150, maximum aggression
      max_position_percent: 98.0
      daily_target_percent: 20.0
      leverage_simulation: 3.5
      max_concurrent_trades: 7
      
    - capital: 500.00            # At $500, consider institutional
      max_position_percent: 99.0
      daily_target_percent: 15.0
      leverage_simulation: 4.0
      max_concurrent_trades: 10
      upgrade_recommendation: true

# AGGRESSIVE PROJECTIONS
projections:
  conservative_scenario:
    daily_return_percent: 15.0    # 15% daily
    days_to_100: 5               # 5 days to $100
    days_to_500: 13              # ~2 weeks to $500
    days_to_1000: 18             # ~2.5 weeks to $1000
    
  moderate_scenario:
    daily_return_percent: 25.0    # 25% daily
    days_to_100: 3               # 3 days to $100
    days_to_500: 8               # ~1 week to $500
    days_to_1000: 11             # ~1.5 weeks to $1000
    
  aggressive_scenario:
    daily_return_percent: 40.0    # 40% daily (very risky)
    days_to_100: 2               # 2 days to $100
    days_to_500: 6               # 6 days to $500
    days_to_1000: 8              # 8 days to $1000
    
  extreme_scenario:
    daily_return_percent: 60.0    # 60% daily (extremely risky)
    days_to_100: 1.5             # 1.5 days to $100
    days_to_500: 4               # 4 days to $500
    days_to_1000: 5              # 5 days to $1000

# SAFETY FEATURES (Reduced for aggression)
safety:
  emergency_stop:
    enabled: true
    trigger_loss_percent: 40.0   # Stop if lose 40% of capital
    
  daily_limits:
    max_trades_per_day: 100      # Max 100 trades per day
    max_gas_spend_per_day: 25.00 # Max $25 gas per day
    
  weekly_limits:
    max_drawdown_percent: 50.0   # Max 50% weekly drawdown

# ADVANCED FEATURES
advanced_features:
  ai_prediction_enabled: true
  quantum_optimization: true
  sentiment_analysis: true
  whale_tracking: true
  news_impact_analysis: true
  
  machine_learning:
    model_types:
      - neural_networks
      - gradient_boosting
      - random_forest
      - svm
    ensemble_learning: true
    real_time_training: true
    
  risk_models:
    value_at_risk: true
    monte_carlo_simulation: true
    stress_testing: true
    correlation_analysis: true

# PROFIT MAXIMIZATION FEATURES
profit_maximization:
  opportunity_stacking: true     # Stack multiple opportunities
  profit_compounding: true      # Compound all profits immediately
  reinvestment_rate: 100.0      # Reinvest 100% of profits
  
  optimization_targets:
    - maximize_daily_return
    - minimize_gas_costs
    - maximize_trade_frequency
    - optimize_capital_efficiency
    
  performance_boosters:
    - parallel_execution
    - predictive_scanning
    - dynamic_position_sizing
    - adaptive_strategy_selection

# EDUCATIONAL FEATURES (Reduced for focus on profits)
education:
  show_explanations: false       # Focus on execution, not education
  learning_mode: false          # Aggressive mode, not learning
  tips_and_tricks: false        # No distractions
  
  milestones:
    - capital: 75.00
      message: "50% growth! Increasing aggression! 🔥"
    - capital: 100.00
      message: "DOUBLED! Time for maximum aggression! 🚀"
    - capital: 250.00
      message: "5x growth! You're crushing it! 💎"
    - capital: 500.00
      message: "10x growth! Consider institutional upgrade! 🏆"
    - capital: 1000.00
      message: "20x growth! You've mastered the system! 👑"