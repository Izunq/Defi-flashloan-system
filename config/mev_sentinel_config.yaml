# MEV Sentinel Configuration
web3_provider: "http://localhost:8545"
flashbots_relay: "https://relay.flashbots.net"
monitoring_interval: 1
max_workers: 5
db_path: "mev_sentinel.db"
block_history_size: 100
protected_addresses: []
protected_contracts: []
min_profit_threshold: 0.01  # In ETH
gas_price_bump_percentage: 10
private_mempool_enabled: true
randomized_submission_enabled: true
known_mev_bots: []
notification:
  email: false
  slack: false
  webhook: false
protection_strategies:
  frontrunning: true
  backrunning: true
  sandwich_attack: true
  time_bandit: false