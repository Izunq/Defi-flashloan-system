# 💰 MICRO-CAPITAL ARBITRAGE CONFIGURATION - $50 STARTER EDITION
# ================================================================

# REALISTIC SETTINGS FOR SMALL CAPITAL
capital_settings:
  starting_capital_usd: 50.00
  minimum_profit_usd: 0.50        # 50 cents minimum profit
  maximum_gas_cost_usd: 2.00      # Max $2 gas cost per trade
  position_size_percent: 80.0     # Use max 80% of capital per trade
  
# REALISTIC PERFORMANCE TARGETS
performance_targets:
  daily_target_percent: 10.0      # 10% daily target ($5 on $50)
  weekly_target_percent: 50.0     # 50% weekly target
  monthly_target_percent: 200.0   # 200% monthly target (3x capital)
  compound_growth: true           # Reinvest profits
  
# RISK MANAGEMENT (Conservative for small capital)
risk_management:
  stop_loss_percent: 5.0          # 5% stop loss
  max_daily_loss_percent: 20.0    # Max 20% daily loss
  max_consecutive_losses: 3       # Stop after 3 losses in a row
  
# NETWORK PREFERENCES (Cheap gas chains)
networks:
  preferred_chains:
    - polygon      # ~$0.01 gas
    - bsc         # ~$0.20 gas  
    - arbitrum    # ~$0.50 gas
    - optimism    # ~$0.30 gas
  
  avoid_chains:
    - ethereum    # Too expensive for micro capital
    
  gas_limits:
    polygon: 0.05     # Max $0.05 gas on Polygon
    bsc: 0.50         # Max $0.50 gas on BSC
    arbitrum: 1.00    # Max $1.00 gas on Arbitrum
    optimism: 0.75    # Max $0.75 gas on Optimism

# TRADING PAIRS (Focus on stable, liquid pairs)
trading_pairs:
  stablecoin_arbitrage:
    - USDC/USDT    # Low risk, small spreads
    - DAI/USDC     # Stable arbitrage
    - BUSD/USDT    # BSC stablecoin arb
    
  wrapped_token_arbitrage:
    - WETH/ETH     # Wrapped token opportunities
    - WMATIC/MATIC # Polygon native
    - WBNB/BNB     # BSC native
    
  major_pairs:
    - ETH/USDC     # High volume
    - BTC/USDT     # High volume
    - MATIC/USDC   # Polygon ecosystem

# DEX PREFERENCES (High volume, reliable)
dex_preferences:
  polygon:
    primary:
      - quickswap
      - sushiswap
      - uniswap_v3
    secondary:
      - curve
      - balancer
      
  bsc:
    primary:
      - pancakeswap
      - biswap
    secondary:
      - venus
      - ellipsis
      
  arbitrum:
    primary:
      - uniswap_v3
      - sushiswap
    secondary:
      - curve
      - balancer

# EXECUTION SETTINGS
execution:
  max_slippage_percent: 1.0       # 1% max slippage
  execution_timeout_seconds: 30   # 30 second timeout
  retry_attempts: 2               # Retry failed trades twice
  
  # Timing settings
  scan_interval_seconds: 15       # Scan every 15 seconds
  opportunity_expiry_seconds: 60  # Opportunities expire in 1 minute
  
  # Position sizing
  min_trade_size_usd: 5.00       # Minimum $5 trade
  max_trade_size_usd: 40.00      # Maximum $40 trade (80% of $50)

# MONITORING & ALERTS
monitoring:
  log_level: INFO
  save_trades: true
  trade_history_file: "micro_trades.json"
  
  alerts:
    profit_threshold_usd: 2.00    # Alert when profit > $2
    loss_threshold_usd: 5.00      # Alert when loss > $5
    daily_target_reached: true    # Alert when daily target reached
    
  reporting:
    daily_summary: true
    weekly_summary: true
    performance_tracking: true

# GROWTH STRATEGY
growth_strategy:
  compound_profits: true          # Reinvest all profits
  
  scaling_thresholds:
    - capital: 100.00            # At $100, increase position sizes
      max_position_percent: 85.0
      daily_target_percent: 8.0
      
    - capital: 250.00            # At $250, more aggressive
      max_position_percent: 90.0
      daily_target_percent: 6.0
      
    - capital: 500.00            # At $500, consider advanced strategies
      max_position_percent: 95.0
      daily_target_percent: 5.0
      upgrade_recommendation: true

# REALISTIC PROJECTIONS
projections:
  conservative_scenario:
    daily_return_percent: 5.0     # 5% daily
    days_to_100: 14              # 2 weeks to $100
    days_to_500: 48              # ~7 weeks to $500
    days_to_1000: 62             # ~9 weeks to $1000
    
  moderate_scenario:
    daily_return_percent: 10.0    # 10% daily
    days_to_100: 7               # 1 week to $100
    days_to_500: 24              # ~3.5 weeks to $500
    days_to_1000: 31             # ~4.5 weeks to $1000
    
  aggressive_scenario:
    daily_return_percent: 20.0    # 20% daily (risky)
    days_to_100: 4               # 4 days to $100
    days_to_500: 12              # ~2 weeks to $500
    days_to_1000: 16             # ~2.5 weeks to $1000

# SAFETY FEATURES
safety:
  emergency_stop:
    enabled: true
    trigger_loss_percent: 50.0   # Stop if lose 50% of capital
    
  daily_limits:
    max_trades_per_day: 20       # Max 20 trades per day
    max_gas_spend_per_day: 10.00 # Max $10 gas per day
    
  weekly_limits:
    max_drawdown_percent: 30.0   # Max 30% weekly drawdown
    
# EDUCATIONAL FEATURES
education:
  show_explanations: true        # Explain each trade
  learning_mode: true           # Extra logging for learning
  tips_and_tricks: true         # Show optimization tips
  
  milestones:
    - capital: 75.00
      message: "Great! You've grown 50%! 🎉"
    - capital: 100.00
      message: "Doubled your money! Time to scale up! 🚀"
    - capital: 250.00
      message: "5x growth! You're getting good at this! 💎"
    - capital: 500.00
      message: "10x growth! Consider upgrading to advanced strategies! 🏆"