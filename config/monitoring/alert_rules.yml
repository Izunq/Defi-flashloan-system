# Alert Rules for Arbitrage System
groups:
  - name: arbitrage.rules
    rules:
      # High-level system alerts
      - alert: SystemDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."

      # Artemis AI Core alerts
      - alert: ArtemisAIHighResponseTime
        expr: artemis_response_time_seconds > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Artemis AI response time is high"
          description: "Artemis AI response time is {{ $value }} seconds"

      # Trading alerts
      - alert: HighProfitOpportunity
        expr: arbitrage_profit_percentage > 2
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "High profit arbitrage opportunity detected"
          description: "Arbitrage opportunity with {{ $value }}% profit detected"

      - alert: TradingLoss
        expr: daily_pnl < -1000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily trading loss exceeded threshold"
          description: "Daily P&L is {{ $value }} USD"

      # Gas price alerts
      - alert: HighGasPrice
        expr: current_gas_price_gwei > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gas price is unusually high"
          description: "Current gas price is {{ $value }} Gwei"

      # Exchange connectivity alerts
      - alert: ExchangeConnectionLost
        expr: exchange_connection_status == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Lost connection to exchange"
          description: "Connection to {{ $labels.exchange }} has been lost"

      # Data ingestion alerts
      - alert: DataIngestionLag
        expr: data_ingestion_lag_seconds > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Data ingestion lag is high"
          description: "Data ingestion lag is {{ $value }} seconds"

      # Memory and CPU alerts
      - alert: HighMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90%"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%"

      # Database alerts
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_database_numbackends > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of database connections"
          description: "{{ $value }} database connections are active"

  - name: security.rules
    rules:
      # Security alerts
      - alert: UnauthorizedAccess
        expr: increase(failed_login_attempts[5m]) > 10
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Multiple failed login attempts detected"
          description: "{{ $value }} failed login attempts in the last 5 minutes"

      - alert: SuspiciousActivity
        expr: rate(suspicious_requests[1m]) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Suspicious activity detected"
          description: "Unusual request patterns detected"
