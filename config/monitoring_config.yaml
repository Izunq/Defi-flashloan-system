# Monitoring & Alerting Infrastructure Configuration

prometheus:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  targets:
    - name: node_exporter
      endpoint: node-exporter:9100
      metrics_path: /metrics
      scheme: http
      labels:
        service: system
    - name: postgres_exporter
      endpoint: postgres-exporter:9187
      metrics_path: /metrics
      scheme: http
      labels:
        service: database
    - name: redis_exporter
      endpoint: redis-exporter:9121
      metrics_path: /metrics
      scheme: http
      labels:
        service: cache
    - name: clickhouse_exporter
      endpoint: clickhouse-exporter:9363
      metrics_path: /metrics
      scheme: http
      labels:
        service: analytics
    - name: kafka_exporter
      endpoint: kafka-exporter:9308
      metrics_path: /metrics
      scheme: http
      labels:
        service: messaging
    - name: arbitrage_exporter
      endpoint: arbitrage-exporter:9090
      metrics_path: /metrics
      scheme: http
      labels:
        service: arbitrage
  rules:
    - name: node_rules
      rules:
        - alert: HighCPULoad
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU load (instance {{ $labels.instance }})"
            description: "CPU load is > 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: HighMemoryUsage
          expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage (instance {{ $labels.instance }})"
            description: "Memory usage is > 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: HighDiskUsage
          expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High disk usage (instance {{ $labels.instance }})"
            description: "Disk usage is > 85%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - name: database_rules
      rules:
        - alert: PostgresDown
          expr: pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL down (instance {{ $labels.instance }})"
            description: "PostgreSQL instance is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: PostgresHighConnections
          expr: sum by (datname) (pg_stat_activity_count) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL high connections (instance {{ $labels.instance }})"
            description: "PostgreSQL instance has more than 100 connections\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: PostgresSlowQueries
          expr: pg_stat_activity_max_tx_duration{datname!~"template.*|postgres"} > 60
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL slow queries (instance {{ $labels.instance }})"
            description: "PostgreSQL has queries running for more than 60 seconds\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - name: arbitrage_rules
      rules:
        - alert: ArbitrageOpportunityDetected
          expr: arbitrage_opportunity_profit > 100
          for: 10s
          labels:
            severity: info
          annotations:
            summary: "High profit arbitrage opportunity detected"
            description: "Arbitrage opportunity with profit > $100 detected\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: ArbitrageExecutionFailed
          expr: arbitrage_execution_failures_total > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Arbitrage execution failures detected"
            description: "Arbitrage execution has failed\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: GasPriceSpike
          expr: ethereum_gas_price > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Ethereum gas price spike detected"
            description: "Gas price is > 100 Gwei\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

grafana:
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      access: proxy
      is_default: true
    - name: Elasticsearch
      type: elasticsearch
      url: http://elasticsearch:9200
      access: proxy
      database: "[logs-]YYYY.MM.DD"
      json_data:
        timeField: "@timestamp"
        esVersion: 7.10.0
    - name: PostgreSQL
      type: postgres
      url: primary-db.internal:5432
      database: flashloan_primary
      user: ${GRAFANA_DB_USER}
      secure_json_data:
        password: ${GRAFANA_DB_PASSWORD}
    - name: ClickHouse
      type: grafana-clickhouse-datasource
      url: http://analytics-db.internal:8123
      access: proxy
      json_data:
        defaultDatabase: flashloan_analytics
        username: ${GRAFANA_CLICKHOUSE_USER}
      secure_json_data:
        password: ${GRAFANA_CLICKHOUSE_PASSWORD}
  dashboards:
    - name: System Overview
      folder: System
      panels:
        - title: CPU Usage
          type: graph
          datasource: Prometheus
          targets:
            - expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              legend: "CPU Usage"
        - title: Memory Usage
          type: graph
          datasource: Prometheus
          targets:
            - expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100
              legend: "Memory Usage %"
        - title: Disk Usage
          type: graph
          datasource: Prometheus
          targets:
            - expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"})
              legend: "Disk Usage %"
        - title: Network Traffic
          type: graph
          datasource: Prometheus
          targets:
            - expr: irate(node_network_receive_bytes_total[5m])
              legend: "Network Receive"
            - expr: irate(node_network_transmit_bytes_total[5m])
              legend: "Network Transmit"
    - name: Database Performance
      folder: Database
      panels:
        - title: PostgreSQL Connections
          type: graph
          datasource: Prometheus
          targets:
            - expr: sum by (datname) (pg_stat_activity_count)
              legend: "Connections - {{ datname }}"
        - title: PostgreSQL Query Duration
          type: graph
          datasource: Prometheus
          targets:
            - expr: pg_stat_activity_max_tx_duration{datname!~"template.*|postgres"}
              legend: "Max Query Duration - {{ datname }}"
        - title: ClickHouse Query Performance
          type: graph
          datasource: Prometheus
          targets:
            - expr: clickhouse_query_duration_seconds
              legend: "Query Duration"
        - title: Redis Memory Usage
          type: graph
          datasource: Prometheus
          targets:
            - expr: redis_memory_used_bytes / redis_memory_max_bytes * 100
              legend: "Memory Usage %"
    - name: Arbitrage Dashboard
      folder: Arbitrage
      panels:
        - title: Detected Opportunities
          type: graph
          datasource: Prometheus
          targets:
            - expr: arbitrage_opportunities_detected_total
              legend: "Opportunities Detected"
        - title: Executed Trades
          type: graph
          datasource: Prometheus
          targets:
            - expr: arbitrage_trades_executed_total
              legend: "Trades Executed"
        - title: Profit
          type: graph
          datasource: Prometheus
          targets:
            - expr: arbitrage_profit_total
              legend: "Total Profit"
        - title: Gas Costs
          type: graph
          datasource: Prometheus
          targets:
            - expr: arbitrage_gas_cost_total
              legend: "Total Gas Cost"
        - title: Execution Time
          type: graph
          datasource: Prometheus
          targets:
            - expr: arbitrage_execution_time_seconds
              legend: "Execution Time"

elasticsearch:
  cluster_name: flashloan-logging
  node_name: es-node-1
  bootstrap_memory_lock: true
  discovery_type: single-node
  indices:
    - name: logs
      mappings:
        properties:
          timestamp:
            type: date
          level:
            type: keyword
          message:
            type: text
          service:
            type: keyword
          trace_id:
            type: keyword
          span_id:
            type: keyword
          user_id:
            type: keyword
          request_id:
            type: keyword
          duration_ms:
            type: float
          status_code:
            type: integer
          method:
            type: keyword
          path:
            type: keyword
          ip:
            type: ip
          user_agent:
            type: text
            fields:
              keyword:
                type: keyword
          error:
            type: text
          stack_trace:
            type: text

kibana:
  server_name: kibana
  elasticsearch_hosts: ["http://elasticsearch:9200"]
  index_patterns:
    - title: logs-*
      index_pattern: logs-*
      time_field_name: timestamp
  visualizations:
    - title: Log Levels
      type: pie
      params:
        field: level
  dashboards:
    - title: Log Analysis
      panels:
        - title: Log Levels
          type: visualization
          visualization_id: Log Levels
        - title: Error Rate
          type: visualization
          visualization_id: Error Rate
        - title: Response Time
          type: visualization
          visualization_id: Response Time
        - title: Log Explorer
          type: search
          search_id: Log Explorer

jaeger:
  service_name: flashloan
  sampler_type: const
  sampler_param: 1
  reporter_log_spans: true
  reporter_max_queue_size: 100
  reporter_flush_interval: 1s
  tags:
    - key: environment
      value: production

behavioral_analysis:
  anomaly_detection:
    algorithms:
      - name: isolation_forest
        params:
          n_estimators: 100
          contamination: 0.01
      - name: local_outlier_factor
        params:
          n_neighbors: 20
          contamination: 0.01
      - name: one_class_svm
        params:
          nu: 0.01
          kernel: rbf
    features:
      - name: request_rate
        window: 5m
      - name: error_rate
        window: 5m
      - name: response_time
        window: 5m
      - name: unique_ips
        window: 1h
  user_behavior:
    features:
      - name: login_frequency
        window: 24h
      - name: transaction_frequency
        window: 24h
      - name: transaction_amount
        window: 24h
      - name: ip_address_changes
        window: 24h
      - name: user_agent_changes
        window: 24h
    baselines:
      training_period: 7d
      update_frequency: 1d
  threat_hunting:
    rules:
      - name: multiple_failed_logins
        condition: "failed_login_count > 5"
        window: 10m
        severity: high
      - name: unusual_transaction_amount
        condition: "transaction_amount > 3 * avg_transaction_amount"
        window: 24h
        severity: medium
      - name: unusual_login_time
        condition: "hour_of_day < 6 || hour_of_day > 22"
        window: 1h
        severity: low
      - name: unusual_ip_location
        condition: "ip_country != usual_ip_country"
        window: 24h
        severity: high

automated_response:
  incident_response:
    rules:
      - name: high_cpu_usage
        condition: "cpu_usage > 90"
        actions:
          - type: alert
            params:
              channels: ["slack", "email"]
              severity: critical
          - type: scale
            params:
              service: arbitrage-engine
              replicas: "+2"
      - name: database_connection_spike
        condition: "db_connections > 100"
        actions:
          - type: alert
            params:
              channels: ["slack"]
              severity: warning
          - type: execute
            params:
              command: "analyze_db_connections.sh"
      - name: arbitrage_execution_failure
        condition: "arbitrage_execution_failures > 0"
        actions:
          - type: alert
            params:
              channels: ["slack", "pagerduty"]
              severity: critical
          - type: execute
            params:
              command: "restart_arbitrage_engine.sh"
  self_healing:
    rules:
      - name: service_unhealthy
        condition: "health_check_failures > 3"
        actions:
          - type: restart
            params:
              service: "{{ service }}"
          - type: alert
            params:
              channels: ["slack"]
              severity: warning
              message: "Service {{ service }} automatically restarted after {{ health_check_failures }} failed health checks"
      - name: disk_space_low
        condition: "disk_usage > 85"
        actions:
          - type: execute
            params:
              command: "cleanup_disk_space.sh"
          - type: alert
            params:
              channels: ["slack"]
              severity: warning
  alerting:
    channels:
      - name: slack
        type: slack
        params:
          webhook_url: "${SLACK_WEBHOOK_URL}"
          channel: "#alerts"
      - name: email
        type: email
        params:
          smtp_server: "smtp.example.com"
          smtp_port: 587
          smtp_user: "${SMTP_USER}"
          smtp_password: "${SMTP_PASSWORD}"
          from_email: "alerts@flashloan.example.com"
          to_emails: ["ops@flashloan.example.com", "security@flashloan.example.com"]
      - name: pagerduty
        type: pagerduty
        params:
          integration_key: "${PAGERDUTY_KEY}"
          severity_mapping:
            critical: critical
            warning: warning
            info: info