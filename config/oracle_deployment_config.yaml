# Oracle Security Deployment Configuration

# Network configuration
network:
  rpc_url: "${WEB3_PROVIDER_URL}"
  chain_id: ${CHAIN_ID}
  gas_limit: 8000000
  gas_price: "auto"
  poa: false  # Set to true for Proof of Authority networks

# Security configuration
security:
  max_deviation: 500                    # 5% maximum price deviation (basis points)
  circuit_breaker_threshold: 1000       # 10% circuit breaker threshold (basis points)
  min_oracles: 3                        # Minimum oracle consensus requirement
  staleness_threshold: 3600             # 1 hour staleness threshold (seconds)
  anomaly_threshold: 9500               # 95% anomaly detection threshold
  emergency_threshold: 9800             # 98% emergency mode threshold

# Oracle sources configuration
oracles:
  chainlink_eth_usd:
    address: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
    weight: 40
    source: "Chainlink ETH/USD"
    heartbeat: 3600
    update_threshold: 100
    
  chainlink_btc_usd:
    address: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c"
    weight: 40
    source: "Chainlink BTC/USD"
    heartbeat: 3600
    update_threshold: 100
    
  chainlink_usdc_usd:
    address: "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6"
    weight: 20
    source: "Chainlink USDC/USD"
    heartbeat: 86400
    update_threshold: 50

# Assets to monitor
tracked_assets:
  - "ETH"
  - "BTC" 
  - "USDC"
  - "USDT"
  - "DAI"
  - "LINK"
  - "UNI"
  - "AAVE"

# Advanced security features
advanced_security:
  statistical_analysis:
    enabled: true
    window_size: 100
    significance_threshold: 9973  # 99.73% (3 sigma)
    
  anomaly_detection:
    isolation_forest: true
    z_score_analysis: true
    mahalanobis_distance: true
    velocity_analysis: true
    
  threat_detection:
    flash_loan_detection: true
    coordination_detection: true
    volume_manipulation: true
    timestamp_validation: true
    
  circuit_breakers:
    asset_level: true
    global_level: true
    cooling_period: 3600  # 1 hour
    escalation_threshold: 3  # assets

# Monitoring configuration
monitoring:
  real_time_interval: 30      # 30 seconds
  statistical_interval: 300   # 5 minutes
  threat_analysis_interval: 900  # 15 minutes
  health_check_interval: 60   # 1 minute
  
  alert_thresholds:
    low: 5000     # 50%
    medium: 7000  # 70%
    high: 8500    # 85%
    critical: 9500  # 95%

# Machine Learning configuration
ml_config:
  anomaly_detection:
    model_type: "isolation_forest"
    contamination_rate: 0.1
    feature_window: 50
    retrain_interval: 86400  # 24 hours
    
  threat_prediction:
    enabled: true
    prediction_horizon: 3600  # 1 hour
    confidence_threshold: 80
    
# Alert and notification settings
alerts:
  channels:
    email: "${ALERT_EMAIL}"
    webhook: "${ALERT_WEBHOOK_URL}"
    telegram_bot: "${TELEGRAM_BOT_TOKEN}"
    telegram_chat: "${TELEGRAM_CHAT_ID}"
    
  severity_routing:
    low: ["log"]
    medium: ["log", "webhook"]
    high: ["log", "webhook", "email"]
    critical: ["log", "webhook", "email", "telegram"]

# Role-based access control
access_control:
  admin_roles:
    - "VALIDATOR_ADMIN_ROLE"
    - "SECURITY_ANALYST_ROLE"
    - "EMERGENCY_RESPONSE_ROLE"
    
  monitoring_roles:
    - "ORACLE_REPORTER_ROLE"
    - "MONITOR_ADMIN_ROLE"
    
  emergency_roles:
    - "EMERGENCY_RESPONSE_ROLE"
    - "CIRCUIT_BREAKER_ROLE"

# Data retention policies
data_retention:
  price_history: 2592000      # 30 days
  threat_history: 7776000     # 90 days
  alert_history: 2592000      # 30 days
  statistical_data: 7776000   # 90 days

# Performance optimization
performance:
  max_history_length: 1000
  batch_processing_size: 50
  max_concurrent_validations: 10
  cache_expiry: 300  # 5 minutes
  
# Integration settings
integrations:
  chainlink:
    enabled: true
    api_key: "${CHAINLINK_API_KEY}"
    
  band_protocol:
    enabled: false
    api_key: "${BAND_API_KEY}"
    
  api3:
    enabled: false
    api_key: "${API3_API_KEY}"
    
  coingecko:
    enabled: true
    api_key: "${COINGECKO_API_KEY}"
    rate_limit: 100

# Backup and recovery
backup:
  enabled: true
  interval: 86400  # 24 hours
  retention_days: 30
  storage_path: "backups/oracle_security"
  
recovery:
  auto_recovery: true
  max_recovery_attempts: 3
  recovery_cooldown: 3600  # 1 hour

# Development and testing
development:
  test_mode: false
  mock_oracles: false
  simulation_mode: false
  debug_logging: false
  
# Compliance and auditing
compliance:
  audit_logging: true
  regulatory_reporting: true
  data_privacy: true
  retention_compliance: true
