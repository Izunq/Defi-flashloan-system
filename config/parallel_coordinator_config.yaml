# Parallel Opportunity Coordinator Configuration
# ==========================================

# Redis connection for inter-agent communication
redis_url: "redis://localhost:6379/0"

# Web3 provider for blockchain interaction
web3_provider: "http://localhost:8545"

# Opportunity time-to-live in seconds
opportunity_ttl_seconds: 30

# Minimum profit threshold in USD
min_profit_threshold_usd: 1.0

# Maximum number of worker threads
max_worker_threads: 20

# Halal compliance mode
halal_mode: false

# Execution parameters
execution:
  max_concurrent_executions: 3
  max_gas_price_gwei: 100
  confirmation_blocks: 1
  timeout_seconds: 60
  retry_count: 3
  retry_delay_seconds: 2

# Opportunity evaluation
opportunity_evaluation:
  min_confidence: 0.7
  max_steps: 5
  max_chains: 3
  prioritize_by: "profit"  # Options: profit, risk, ratio

# Logging configuration
logging:
  level: "INFO"
  file: "logs/coordinator/parallel_coordinator.log"
  max_size_mb: 10
  backup_count: 5

# Performance metrics
metrics:
  enabled: true
  collection_interval_seconds: 60
  retention_days: 7

# Security settings
security:
  input_validation: true
  transaction_signing: "secure"
  max_gas_price_gwei: 100

# Notification settings
notifications:
  min_profit_for_notification_usd: 5.0
  channels:
    - "opportunity_alerts"
    - "execution_alerts"