# Swarm Intelligence Agent V38 Configuration

# Web3 connection
web3_provider: "http://localhost:8545"
# private_key removed for security - using secure transaction signer instead

# Contract addresses
contract_addresses:
  trust_curve: "0x0000000000000000000000000000000000000000" # Replace with actual address
  strategy_incubator: "0x0000000000000000000000000000000000000000" # Replace with actual address
  swarm_intelligence: "0x0000000000000000000000000000000000000000" # Replace with actual address

# Agent parameters
agent_parameters:
  name: "SwarmAgent_V38"
  description: "Swarm Intelligence Agent for collaborative strategy development"
  collaboration_threshold: 70 # Minimum score to accept collaboration (0-100)
  trust_threshold: 80 # Minimum score to trust a strategy (0-100)
  max_collaborators: 5 # Maximum number of collaborators

# Swarm parameters
swarm_parameters:
  message_check_interval: 60 # Seconds between message checks
  collaboration_interval: 3600 # Seconds between collaboration searches
  marketplace_check_interval: 300 # Seconds between marketplace checks
  max_strategy_price: 100000000000000000 # 0.1 ETH in wei

# ZK proof parameters
zk_proof:
  verification_timeout: 300 # Seconds to wait for verification
  min_verifiers: 2 # Minimum number of verifiers required
  max_verification_age: 86400 # Maximum age of verification (seconds)

# Marketplace parameters
marketplace:
  default_listing_duration: 604800 # 7 days in seconds
  default_listing_price: 50000000000000000 # 0.05 ETH in wei
  auto_list_threshold: 85 # Auto-list strategies with trust score above this

# Collaboration parameters
collaboration:
  max_strategies_per_composition: 5
  min_strategy_trust_score: 70
  composition_fee: 10000000000000000 # 0.01 ETH in wei

# Logging
logging:
  level: "INFO"
  file: "swarm_agent.log"
  max_size: 10485760 # 10 MB
  backup_count: 5