# Unified Monitoring Configuration
# Purpose: Centralized configuration for all monitoring systems

# Global settings
global:
  log_level: INFO
  data_retention_days: 30
  alert_deduplication: true
  performance_monitoring: true

# Monitoring systems configuration
monitoring_systems:
  # Emergency Monitoring System
  emergency_monitoring:
    enabled: true
    bridge_adapter: "emergency_monitoring_adapter"
    data_endpoints: ["health", "alerts", "metrics"]
    data_format: "json"
    sync_interval: 30  # seconds
    priority: 1  # Higher priority for emergency system
    alert_mapping:
      CRITICAL: "CRITICAL"
      HIGH: "HIGH"
      MEDIUM: "MEDIUM"
      LOW: "LOW"
      INFO: "INFO"
  
  # Oracle Monitoring System
  oracle_monitoring:
    enabled: true
    bridge_adapter: "oracle_monitoring_adapter"
    data_endpoints: ["price_feeds", "oracle_health", "manipulation_alerts"]
    data_format: "json"
    sync_interval: 60  # seconds
    priority: 2
    alert_mapping:
      CRITICAL: "CRITICAL"
      HIGH: "HIGH"
      MEDIUM: "MEDIUM"
      LOW: "LOW"
      INFO: "INFO"
  
  # MEV Monitoring System
  mev_monitoring:
    enabled: true
    bridge_adapter: "mev_monitoring_adapter"
    data_endpoints: ["mev_alerts", "protection_status", "transaction_analysis"]
    data_format: "json"
    sync_interval: 45  # seconds
    priority: 2
    alert_mapping:
      critical: "CRITICAL"
      high: "HIGH"
      medium: "MEDIUM"
      low: "LOW"
      info: "INFO"

# Sentinel agents configuration
sentinel_agents:
  enabled: true
  agents:
    - "oracle_sentinel"
    - "mev_sentinel"
    - "strategy_sentinel"
  coordinator: "sentinel_coordinator"
  shared_database: "sentinel_shared.db"

# Data integration settings
data_integration:
  # Alert correlation settings
  alert_correlation:
    enabled: true
    correlation_window: 300  # seconds
    similarity_threshold: 0.7
    max_group_size: 10
    deduplication_enabled: true
  
  # Metrics aggregation
  metrics_aggregation:
    enabled: true
    aggregation_interval: 300  # seconds
    retention_periods:
      raw: 86400      # 1 day in seconds
      hourly: 604800   # 7 days in seconds
      daily: 2592000   # 30 days in seconds
      monthly: 31536000  # 365 days in seconds
  
  # System health aggregation
  health_aggregation:
    enabled: true
    aggregation_interval: 60  # seconds
    health_check_timeout: 10  # seconds
    critical_components:
      - "oracle_overall"
      - "emergency_overall"
      - "mev_protection_overall"

# Dashboard integration
dashboard_integration:
  enabled: true
  update_interval: 5  # seconds
  max_alerts_displayed: 50
  default_time_range: 3600  # 1 hour in seconds
  sections:
    alerts:
      enabled: true
      max_items: 20
      sort_by: "timestamp"
      sort_order: "desc"
    
    system_health:
      enabled: true
      display_format: "status_cards"
      critical_first: true
    
    metrics:
      enabled: true
      display_format: "charts"
      default_chart_type: "line"
      default_time_range: 3600  # 1 hour in seconds
    
    protection_status:
      enabled: true
      display_format: "gauges"
      refresh_interval: 10  # seconds

# API endpoints for data access
api_endpoints:
  enabled: true
  base_path: "/api/v1"
  endpoints:
    alerts:
      path: "/alerts"
      methods: ["GET", "POST", "PUT"]
      cache_ttl: 5  # seconds
    
    metrics:
      path: "/metrics"
      methods: ["GET"]
      cache_ttl: 30  # seconds
    
    health:
      path: "/health"
      methods: ["GET"]
      cache_ttl: 10  # seconds
    
    dashboard:
      path: "/dashboard"
      methods: ["GET"]
      cache_ttl: 5  # seconds

# Performance monitoring
performance_monitoring:
  enabled: true
  metrics_collection_interval: 60  # seconds
  log_performance_issues: true
  auto_optimization: false
  thresholds:
    cpu_usage_percent: 80
    memory_usage_percent: 80
    disk_usage_percent: 90
    response_time_ms: 500

# Logging configuration
logging:
  console:
    enabled: true
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  file:
    enabled: true
    level: "DEBUG"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    path: "logs/unified_monitoring.log"
    max_size_mb: 10
    backup_count: 5
  
  syslog:
    enabled: false
    level: "WARNING"
    format: "%(name)s: %(levelname)s %(message)s"
    address: "localhost"
    facility: "local0"