# AI/ML Configuration
ai_ml:
  neural_network:
    input_size: 50
    hidden_layers: [128, 64, 32]
    output_size: 3
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    dropout_rate: 0.2
    
  sentiment_analysis:
    model: "ProsusAI/finbert"
    confidence_threshold: 0.7
    sources:
      - twitter
      - news
      - reddit
    weights:
      twitter: 0.3
      news: 0.5
      reddit: 0.2
      
  risk_models:
    var_confidence: 0.95
    lookback_days: 30
    monte_carlo_simulations: 10000
    correlation_threshold: 0.8
    
  prediction_models:
    price_prediction_horizon: 300  # seconds
    volatility_model: "garch"
    trend_indicators: ["sma", "ema", "rsi", "macd"]

# Trading Configuration
trading:
  min_profit_usd: 100
  max_position_size_usd: 50000
  max_gas_price_gwei: 200
  slippage_tolerance: 0.005  # 0.5%
  
  risk_management:
    max_portfolio_risk: 0.02  # 2% of portfolio
    max_single_trade_risk: 0.005  # 0.5% of portfolio
    stop_loss_percentage: 0.05  # 5%
    take_profit_percentage: 0.10  # 10%
    max_drawdown: 0.15  # 15%
    
  execution:
    max_concurrent_trades: 5
    execution_timeout: 300  # seconds
    retry_attempts: 3
    use_flashbots: true
    use_private_mempool: true
    
  portfolio_optimization:
    method: "markowitz"  # markowitz, black_litterman, risk_parity
    rebalance_frequency: 3600  # seconds
    correlation_lookback: 86400  # seconds
    
# MEV Protection
mev_protection:
  enabled: true
  flashbots_relay: "https://relay.flashbots.net"
  private_mempools:
    - "https://api.blocknative.com"
    - "https://api.eden.network"
  commit_reveal_scheme: true
  time_based_execution: true
  execution_window_blocks: 3

# Market Data Sources
market_data:
  primary_sources:
    - "coingecko"
    - "coinmarketcap"
    - "defipulse"
  
  dex_data_sources:
    - "thegraph"
    - "dune_analytics"
    - "nansen"
    
  news_sources:
    - "newsapi"
    - "cryptopanic"
    - "coindesk"
    
  social_sources:
    - "twitter"
    - "reddit"
    - "telegram"
    
  update_intervals:
    prices: 1  # seconds
    orderbooks: 2  # seconds
    news: 300  # seconds
    social: 60  # seconds

# Whale Tracking
whale_tracking:
  enabled: true
  min_transaction_usd: 1000000
  tracked_addresses:
    ethereum:
      - "0x47ac0Fb4F2D84898e4D9E7b4DaB3C24507a6D503"  # Binance
      - "0xBE0eB53F46cd790Cd13851d5EFf43D12404d33E8"  # Binance 2
      - "0x8894E0a0c962CB723c1976a4421c95949bE2D4E3"  # Binance 3
    polygon:
      - "0x40ec5B33f54e0E8A33A975908C5BA1c14e5BbbDf"  # Polygon Bridge
    bsc:
      - "0x8894E0a0c962CB723c1976a4421c95949bE2D4E3"  # Binance BSC
      
  alert_thresholds:
    single_transaction: 5000000  # $5M
    hourly_volume: 50000000  # $50M
    
# Performance Monitoring
monitoring:
  metrics_retention_days: 90
  alert_thresholds:
    success_rate_min: 0.8  # 80%
    profit_margin_min: 0.02  # 2%
    gas_efficiency_max: 500000  # gas units
    execution_time_max: 30  # seconds
    
  notifications:
    telegram:
      enabled: true
      bot_token: "${TELEGRAM_BOT_TOKEN}"
      chat_id: "${TELEGRAM_CHAT_ID}"
    
    discord:
      enabled: false
      webhook_url: "${DISCORD_WEBHOOK_URL}"
      
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      username: "${EMAIL_USERNAME}"
      password: "${EMAIL_PASSWORD}"

# Database Configuration
database:
  type: "sqlite"  # sqlite, postgresql, mysql
  url: "sqlite:///ultimate_arbitrage.db"
  pool_size: 10
  max_overflow: 20
  
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD}"

# Security Configuration
security:
  private_key_encrypted: true
  use_hardware_wallet: false
  multi_sig_enabled: false
  
  api_keys:
    encrypt_at_rest: true
    rotation_days: 30
    
  access_control:
    admin_addresses:
      - "${ADMIN_ADDRESS_1}"
      - "${ADMIN_ADDRESS_2}"
    
# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  files:
    main_log: "ultimate_arbitrage.log"
    error_log: "errors.log"
    performance_log: "performance.log"
    trades_log: "trades.log"
    
  rotation:
    max_size_mb: 100
    backup_count: 10
    
# Emergency Configuration
emergency:
  circuit_breakers:
    max_consecutive_failures: 5
    max_daily_loss_usd: 10000
    min_success_rate: 0.5
    
  auto_shutdown_triggers:
    - "flash_crash_detected"
    - "unusual_gas_prices"
    - "exchange_outage"
    - "smart_contract_exploit"
    
  recovery_procedures:
    auto_restart: true
    restart_delay_minutes: 30
    max_restart_attempts: 3

# Advanced Features
advanced_features:
  cross_chain_arbitrage: true
  triangular_arbitrage: true
  statistical_arbitrage: true
  pairs_trading: true
  mean_reversion: true
  momentum_trading: false
  
  experimental:
    quantum_computing: false
    genetic_algorithms: true
    reinforcement_learning: true
    ensemble_methods: true