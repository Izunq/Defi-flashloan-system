# Optional: Use with 'docker compose -f docker-compose.yml -f docker-compose.dev.yml up'
# for enhanced development experience with hot reload

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    command: npm run dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - path: ./src
          action: sync
        - path: ./package.json
          action: rebuild

  backend:
    develop:
      watch:
        - path: ./backend/src
          action: sync
        - path: ./backend/package.json
          action: rebuild

  server:
    develop:
      watch:
        - path: ./server
          action: sync
        - path: ./server/package.json
          action: rebuild
