version: '3.8'

services:
  # Nginx for SSL termination and reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl/nginx-${DOMAIN:-localhost}.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
    user: nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required for binding to ports 80/443
    read_only: true

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NODE_ENV=production
    environment:
      - REACT_APP_BACKEND_URL=https://${DOMAIN:-localhost}/api
      - REACT_APP_WS_ENDPOINT=wss://${DOMAIN:-localhost}/ws
    depends_on:
      - backend
    volumes:
      - frontend_build:/app/build
    restart: always
    user: node
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=flashloan_v35
      - RPC_URL=${RPC_URL}
      # Removed PRIVATE_KEY environment variable
      - HSM_ENABLED=${HSM_ENABLED:-true}
      - HSM_PROVIDER=${HSM_PROVIDER:-aws}
      - HSM_CONFIG_PATH=/run/secrets/hsm_config
      - MULTISIG_ENABLED=${MULTISIG_ENABLED:-false}
      - MULTISIG_ADDRESS=${MULTISIG_ADDRESS}
      - MULTISIG_INTERFACE=${MULTISIG_INTERFACE:-gnosis}
      - TRUST_CURVE_ADDRESS=${TRUST_CURVE_ADDRESS}
      - PROOF_EXECUTOR_ADDRESS=${PROOF_EXECUTOR_ADDRESS}
      - API_KEY=${API_KEY}
      - PYTHON_AGENT_URL=http://python_agent:5000
      - DOMAIN=${DOMAIN:-localhost}
      - ENABLE_METRICS=true
    depends_on:
      - mongodb
      - python_agent
    restart: always
    user: node
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    secrets:
      - hsm_config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # Python Agent
  python_agent:
    build:
      context: ./python_agent
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    environment:
      - PORT=5000
      - RPC_URL=${RPC_URL}
      # Removed PRIVATE_KEY environment variable
      - HSM_ENABLED=${HSM_ENABLED:-true}
      - HSM_PROVIDER=${HSM_PROVIDER:-aws}
      - HSM_CONFIG_PATH=/run/secrets/hsm_config
      - MULTISIG_ENABLED=${MULTISIG_ENABLED:-false}
      - MULTISIG_ADDRESS=${MULTISIG_ADDRESS}
      - MULTISIG_INTERFACE=${MULTISIG_INTERFACE:-gnosis}
      - TRUST_CURVE_ADDRESS=${TRUST_CURVE_ADDRESS}
      - PROOF_EXECUTOR_ADDRESS=${PROOF_EXECUTOR_ADDRESS}
      - API_KEY=${API_KEY}
      - ENABLE_METRICS=true
    restart: always
    user: appuser
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    secrets:
      - hsm_config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # MongoDB
  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb_data:/data/db
    restart: always
    user: mongodb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # MongoDB needs to write to its data directory
    tmpfs:
      - /tmp

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: always
    user: nobody
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  # Web Application Firewall
  waf:
    image: owasp/modsecurity-crs:apache
    ports:
      - "8000:80"
    environment:
      - PARANOIA=1
      - ANOMALY_INBOUND=10
      - ANOMALY_OUTBOUND=5
    depends_on:
      - nginx
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required for binding to port 80
    user: www-data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2

volumes:
  mongodb_data:
  frontend_build:

secrets:
  hsm_config:
    file: ./hsm_config.json