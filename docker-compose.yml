# Docker Compose for development environment
version: '3.8'

services:
  # Frontend - React/Vite application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashloan-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:8080
      - VITE_PROXY_URL=http://server:3001
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend
      - server
    networks:
      - flashloan-network
    restart: unless-stopped

  # Backend - Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashloan-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017/flashloan
      - REDIS_URL=redis://redis:6379
      - INFURA_URL=${INFURA_URL}
      - EXECUTOR_PRIVATE_KEY=${EXECUTOR_PRIVATE_KEY}
      - ARBITRAGE_CONTRACT_ADDRESS=${ARBITRAGE_CONTRACT_ADDRESS}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - mongo
      - redis
    networks:
      - flashloan-network
    restart: unless-stopped

  # API Proxy Server - Security layer
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flashloan-proxy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./server:/app
    depends_on:
      - backend
    networks:
      - flashloan-network
    restart: unless-stopped

  # MongoDB database
  mongo:
    image: mongo:7-alpine
    container_name: flashloan-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo-data:/data/db
    networks:
      - flashloan-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: flashloan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - flashloan-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mongo-data:
  redis-data:

networks:
  flashloan-network:
    driver: bridge
