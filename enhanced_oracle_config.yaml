# Enhanced Oracle Security Configuration

# Web3 connection settings
web3:
  provider_url: "${WEB3_PROVIDER_URL}"
  gas_limit: 3000000
  gas_price: "auto"

# Contract addresses
contracts:
  secure_multi_oracle: "${SECURE_MULTI_ORACLE_ADDRESS}"
  oracle_security_wrapper: "${ORACLE_SECURITY_WRAPPER_ADDRESS}"
  oracle_manipulation_monitor: "${ORACLE_MANIPULATION_MONITOR_ADDRESS}"

# Assets to monitor
tracked_assets:
  - "ETH"
  - "BTC"
  - "USDC"
  - "USDT"
  - "DAI"

# Security thresholds
security:
  max_price_deviation: 500          # 5% in basis points
  circuit_breaker_threshold: 1000   # 10% in basis points
  min_oracle_consensus: 3           # Minimum oracles required
  staleness_threshold: 3600         # 1 hour in seconds
  monitoring_interval: 30           # 30 seconds
  anomaly_detection_window: 100     # 100 data points for moving average
  
  # Advanced thresholds
  z_score_threshold: 3.0            # Statistical anomaly threshold
  manipulation_pattern_threshold: 3  # Number of large changes to trigger alert
  large_change_threshold: 0.05      # 5% price change threshold
  
  # Reputation scoring
  reputation_decay_rate: 1.0        # Points lost for bad deviation
  reputation_recovery_rate: 0.1     # Points gained for good performance
  min_reputation_threshold: 20.0    # Minimum reputation to stay active

# Alert configuration
alerts:
  email_notifications: true
  webhook_url: "${ALERT_WEBHOOK_URL}"
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  
  # Alert severity levels
  severity_levels:
    LOW: 
      price_deviation_threshold: 200    # 2%
      notification_channels: ["log"]
    MEDIUM:
      price_deviation_threshold: 500    # 5%
      notification_channels: ["log", "webhook"]
    HIGH:
      price_deviation_threshold: 800    # 8%
      notification_channels: ["log", "webhook", "email"]
    CRITICAL:
      price_deviation_threshold: 1000   # 10%
      notification_channels: ["log", "webhook", "email", "telegram"]

# External oracle sources
external_oracles:
  chainlink:
    enabled: true
    api_key: "${CHAINLINK_API_KEY}"
    endpoints:
      eth_usd: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
      btc_usd: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c"
  
  coingecko:
    enabled: true
    api_key: "${COINGECKO_API_KEY}"
    rate_limit: 100  # requests per minute
    
  band_protocol:
    enabled: false
    api_key: "${BAND_PROTOCOL_API_KEY}"

# Data storage and logging
storage:
  alerts_retention_days: 30
  metrics_retention_days: 90
  data_directory: "data/oracle_security"
  
logging:
  level: "INFO"
  file: "logs/enhanced_oracle_security.log"
  max_size: 10485760  # 10 MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance monitoring
performance:
  max_processing_time: 10.0  # seconds
  memory_usage_threshold: 500  # MB
  alert_queue_size_limit: 1000
  
# Circuit breaker settings
circuit_breaker:
  cooling_period: 3600        # 1 hour cooling period
  manual_override_required: true
  escalation_threshold: 3     # Number of assets before global shutdown
  
# Machine learning anomaly detection
ml_detection:
  enabled: true
  model_type: "isolation_forest"
  contamination_rate: 0.1
  feature_window: 50
  retrain_interval: 86400     # 24 hours
