# Metamorphic Core Configuration

# Web3 Configuration
web3:
  provider_url: ${WEB3_PROVIDER_URL}
  chain_id: ${CHAIN_ID}
  private_key: ${PRIVATE_KEY}

# Contract Addresses
contracts:
  self_amending_protocol: ${SELF_AMENDING_PROTOCOL_ADDRESS}
  trust_curve: ${TRUST_CURVE_ADDRESS}
  proof_marketplace: ${PROOF_MARKETPLACE_ADDRESS}
  proxy_admin: ${PROXY_ADMIN_ADDRESS}

# File Paths
paths:
  contract_sources: "./contracts"
  contract_abis: "./abi"
  output_dir: "./metamorphic_output"
  simulation_results: "./simulation_results"

# Analysis Configuration
analysis:
  # Percentage improvement in gas usage to trigger a proposal
  gas_optimization_threshold: 10
  
  # Minimum security score for proposals (0-100)
  security_score_threshold: 85
  
  # Maximum number of proposals to create per run
  max_proposals_per_run: 3
  
  # Types of improvements to look for
  improvement_types:
    - gas_optimization
    - security_improvement
    - architectural_improvement
    - feature_enhancement

# Simulation Configuration
simulation:
  # Number of simulations to run for each contract
  num_simulations: 1000
  
  # Duration of simulations in days
  simulation_duration_days: 30
  
  # Scenarios to simulate
  scenarios:
    - normal_market
    - high_volatility
    - liquidity_crisis
    - regulatory_change
    - protocol_hack

# Ethical Framework
ethical_framework:
  # Minimum compliance score for proposals (0-100)
  min_compliance_score: 90
  
  # Ethical principles to enforce
  principles:
    - decentralization
    - transparency
    - fairness
    - security
    - privacy
    - sustainability

# AI Model Configuration
ai_models:
  # Code quality analysis model
  code_quality:
    model_type: "codebert"
    threshold: 0.8
  
  # Gas usage prediction model
  gas_prediction:
    model_type: "custom_nn"
    layers: [128, 64, 32]
    dropout: 0.2

# Proposal Generation
proposal_generation:
  # Minimum improvement threshold to trigger a proposal
  min_improvement_threshold: 15
  
  # Cooldown period between proposals for the same contract (in days)
  proposal_cooldown_days: 7
  
  # Maximum number of contracts to analyze per run
  max_contracts_per_run: 5