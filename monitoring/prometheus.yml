global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"
  - "security_rules.yml"  # Added security-specific alert rules

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080']
    # Add security labels for better filtering
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'backend'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'critical'

  - job_name: 'python_agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python_agent:5000']
    # Add security labels for better filtering
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'python_agent'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'critical'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    # Add security labels for better filtering
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'node'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'infrastructure'

  # Security-specific monitoring
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    # Container security monitoring
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'container_security'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'infrastructure'

  # Network security monitoring
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'web_security'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'perimeter'

  # Authentication monitoring
  - job_name: 'auth-metrics'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics/auth'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'authentication'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'critical'

  # Smart contract security monitoring
  - job_name: 'contract-security'
    static_configs:
      - targets: ['python_agent:5000']
    metrics_path: '/metrics/contracts'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'blockchain_security'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'critical'

  # Wallet security monitoring
  - job_name: 'wallet-security'
    static_configs:
      - targets: ['python_agent:5000']
    metrics_path: '/metrics/wallets'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'wallet_security'
      - source_labels: [__address__]
        target_label: security_tier
        replacement: 'critical'