# Oracle Connector Configuration

# Web3 connection settings
web3:
  provider_url: "${WEB3_PROVIDER_URL}"  # Will be replaced with environment variable
  chain_id: ${CHAIN_ID}  # Will be replaced with environment variable
  gas_limit: 3000000
  gas_price: "auto"  # Use "auto" for automatic gas price estimation

# Contract addresses
contracts:
  oracle_address: "${ORACLE_ADDRESS}"  # Will be replaced with environment variable

# Causality Engine configuration
causality_engine:
  config_path: "causality_engine_config.yaml"

# Oracle Connector settings
oracle_connector:
  update_frequency: 3600  # seconds
  min_confidence: 7000    # basis points (70%)
  retry_attempts: 3
  retry_delay: 60         # seconds

# Data storage
data_dir: "data/oracle_connector"

# Logging configuration
logging:
  level: "INFO"
  file: "logs/oracle_connector.log"
  max_size: 10485760  # 10 MB
  backup_count: 5