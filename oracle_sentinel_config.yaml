# Oracle Sentinel Configuration
web3_provider: "http://localhost:8545"
history_size: 100
alert_threshold: 0.8
monitoring_interval: 10
max_workers: 5
db_path: "oracle_sentinel.db"
assets:
  - "ETH"
  - "BTC"
  - "USDT"
  - "USDC"
oracle_sources:
  - "chainlink"
  - "uniswap"
  - "compound"
ml_enabled: true
anomaly_detection:
  isolation_forest:
    contamination: 0.05
    n_estimators: 100
notification:
  email: false
  slack: false
  webhook: false