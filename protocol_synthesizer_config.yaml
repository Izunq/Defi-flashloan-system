# Protocol Synthesizer Configuration

# Web3 Configuration
web3:
  provider_url: ${WEB3_PROVIDER_URL}
  chain_id: ${CHAIN_ID}
  private_key: ${PRIVATE_KEY}

# Contract Addresses
contracts:
  protocol_genesis_engine: ${PROTOCOL_GENESIS_ENGINE_ADDRESS}
  treasury: ${TREASURY_ADDRESS}

# File Paths
paths:
  contract_templates: "./protocol_templates"
  contract_abis: "./abi"
  output_dir: "./protocol_output"
  simulation_results: "./protocol_simulation_results"

# Analysis Configuration
analysis:
  # Minimum score to consider a market inefficiency (0-1)
  inefficiency_threshold: 0.7
  
  # Maximum number of protocols to create per run
  max_protocols_per_run: 1
  
  # Minimum improvement over existing solutions (percentage)
  min_improvement_threshold: 20
  
  # Market metrics to analyze
  market_metrics:
    - price_impact
    - slippage
    - gas_cost
    - capital_efficiency
    - impermanent_loss
    - interest_rate_volatility
    - oracle_reliability
    - liquidation_efficiency

# Simulation Configuration
simulation:
  # Number of simulations to run for each protocol
  num_simulations: 1000
  
  # Duration of simulations in days
  simulation_duration_days: 90
  
  # Scenarios to simulate
  scenarios:
    - normal_market
    - high_volatility
    - liquidity_crisis
    - regulatory_change
    - protocol_hack
    - mass_adoption
    - bear_market
    - bull_market

# Protocol Types
protocol_types:
  - DEX
  - LendingProtocol
  - Derivatives
  - Yield
  - Insurance
  - Stablecoin
  - AssetManagement

# Protocol Performance Criteria
performance_criteria:
  # Minimum success rate in simulations (0-1)
  min_success_rate: 0.9
  
  # Minimum return on investment (0-1)
  min_roi: 0.1
  
  # Maximum drawdown allowed (0-1)
  max_drawdown: 0.2
  
  # Minimum capital efficiency improvement (percentage)
  min_capital_efficiency_improvement: 15
  
  # Maximum gas cost (in gwei)
  max_gas_cost: 500000

# Treasury Allocation
treasury:
  # Default treasury allocation for new protocols (in basis points, e.g., 5000 = 50%)
  default_allocation: 5000
  
  # Maximum allocation per protocol (in basis points)
  max_allocation: 7500
  
  # Minimum allocation per protocol (in basis points)
  min_allocation: 2500

# Protocol Template Parameters
template_parameters:
  DEX:
    fee_tiers: [0.01, 0.05, 0.3, 1.0]
    tick_spacing: [1, 10, 60, 200]
    initial_price_range: 20
    protocol_fee: 0.15
    max_price_impact: 0.5
  
  LendingProtocol:
    base_rate: 0.5
    utilization_slope1: 4.0
    utilization_slope2: 60.0
    optimal_utilization: 80.0
    liquidation_threshold: 85.0
    liquidation_bonus: 5.0
    reserve_factor: 10.0
  
  Derivatives:
    max_leverage: 10
    min_collateral: 10.0
    funding_interval: 8
    max_funding_rate: 0.1
    liquidation_fee: 2.0
    oracle_sources: 3
    oracle_deviation_threshold: 2.0
  
  Yield:
    harvest_frequency: 24
    performance_fee: 2.0
    withdrawal_fee: 0.1
    emergency_exit_fee: 0.5
    min_deposit_period: 7
    max_strategy_count: 10
    rebalance_threshold: 5.0
  
  Insurance:
    premium_rate: 2.5
    coverage_ratio: 150.0
    claim_period: 7
    claim_assessment_period: 3
    min_coverage_amount: 1000
    max_coverage_amount: 10000000
    capital_efficiency_factor: 3
  
  Stablecoin:
    collateral_ratio: 150.0
    stability_fee: 0.5
    liquidation_ratio: 130.0
    liquidation_penalty: 13.0
    debt_ceiling: 10000000
    min_debt: 100
    oracle_security_module_delay: 1
  
  AssetManagement:
    management_fee: 2.0
    performance_fee: 20.0
    high_water_mark: true
    lock_period: 30
    max_drawdown_threshold: 15.0
    rebalance_frequency: 7
    risk_tolerance: 3