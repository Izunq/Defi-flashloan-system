[tool:pytest]
minversion = 7.4
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=75
    --durations=10
    --asyncio-mode=auto
    
testpaths = 
    tests
    test_*.py
    
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security tests
    oracle: marks tests as oracle-related
    blockchain: marks tests requiring blockchain connection
    performance: marks tests as performance tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    emergency: marks tests as emergency scenario tests
    cross_chain: marks tests as cross-chain functionality tests
    gas_optimization: marks tests for gas optimization
    mev_protection: marks tests for MEV protection
    
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*can't resolve package.*:ImportWarning

asyncio_mode = auto
timeout = 300

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
