# Reincarnation Agent V39 Configuration

# Web3 Connection Settings
web3:
  provider_url: "http://localhost:8545"
  chain_id: 1
  gas_limit: 3000000  gas_price: "auto"  
  # SECURITY: Private key support removed - use secure transaction signer instead
  # Secure HSM-based signing required for production

# Contract Addresses
contracts:
  strategy_generator_address: "0x0000000000000000000000000000000000000000"  # Replace with actual address
  trust_curve_address: "0x0000000000000000000000000000000000000000"  # Replace with actual address
  strategy_incubator_address: "0x0000000000000000000000000000000000000000"  # Replace with actual address

# Reinforcement Learning Parameters
rl_params:
  learning_rate: 0.001
  gamma: 0.95  # Discount factor
  epsilon: 1.0  # Initial exploration rate
  epsilon_decay: 0.995
  epsilon_min: 0.01
  batch_size: 32
  memory_size: 10000

# Strategy Monitoring Settings
monitoring:
  poll_interval: 60  # Seconds between checks
  min_executions_before_reincarnation: 10  # Minimum executions required before attempting reincarnation
  max_reincarnation_attempts: 5  # Maximum number of reincarnation attempts per strategy

# Data Storage
data_dir: "data/reincarnation"

# Logging
logging:
  level: "INFO"
  file: "reincarnation_agent_v39.log"

# Model Hyperparameters
model:
  hidden_layers: [64, 128, 64]
  activation: "relu"
  optimizer: "adam"
  loss: "mse"
  update_target_frequency: 100  # Episodes between target model updates

# Reward Function Parameters
rewards:
  success_reward: 100
  failure_penalty: -50
  profit_multiplier: 10  # Multiplier for profit-based rewards
  gas_efficiency_bonus: 5  # Bonus for gas-efficient executions