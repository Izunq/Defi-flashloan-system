# Strategy Generator V37 Configuration

# Web3 connection
web3_provider: "http://localhost:8545"
# private_key removed for security - using secure transaction signer instead

# Contract addresses
contract_addresses:
  trust_curve: "0x0000000000000000000000000000000000000000" # Replace with actual address
  strategy_incubator: "0x0000000000000000000000000000000000000000" # Replace with actual address
  strategy_generator: "0x0000000000000000000000000000000000000000" # Replace with actual address

# Generation parameters
generation_parameters:
  min_performance_threshold: 80 # Minimum performance score (0-100)
  min_executions: 50 # Minimum number of executions
  min_success_rate: 90 # Minimum success rate (%)
  cooldown_period: 86400 # Cooldown period between generations (seconds)
  max_daily_generations: 3 # Maximum number of generations per day

# Model parameters
model_parameters:
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  validation_split: 0.2

# Strategy templates
templates:
  base_template: "AIStrategyTemplate.sol"
  custom_templates:
    - "HighFrequencyTemplate.sol"
    - "LowRiskTemplate.sol"
    - "CrossChainTemplate.sol"

# Security settings
security:
  min_validators: 2 # Minimum number of validators required
  max_bytecode_size: 24576 # Maximum bytecode size (bytes)
  required_tests: 10 # Minimum number of tests required
  min_test_coverage: 90 # Minimum test coverage (%)

# Logging
logging:
  level: "INFO"
  file: "strategy_generator.log"
  max_size: 10485760 # 10 MB
  backup_count: 5